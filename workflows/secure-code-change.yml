version: 1
workflow:
  name: secure-code-change
agents:
  planner: # Architect
    agent: architect
  implementation: # Smith
    agent: smith
  security: # Sentinel
    agent: sentinel
  review: # Inquisitor
    agent: inquisitor
  scout:
    agent: scout
  archivist:
    agent: archivist
scouting:
  enabled: true
checks: []
security:
  failOn: [critical, high, medium]
implementation:
  maxParallel: 4
planning:
  maxGenerations: null
budgets:
  maxTotalTokens: null
  maxTotalRequests: null
  maxTransitions: null
  maxWallClockMs: null
  perRole:
    planner:
      maxTokens: null
      maxAttempts: null
      maxRequests: null
    implementation:
      maxTokens: null
      maxAttempts: null
      maxRequests: null
    security:
      maxTokens: null
      maxAttempts: null
      maxRequests: null
    review:
      maxTokens: null
      maxAttempts: null
      maxRequests: null
    scout:
      maxTokens: null
      maxAttempts: null
      maxRequests: null
    archivist:
      maxTokens: null
      maxAttempts: null
      maxRequests: null
context:
  maxInlineChars: 12000
memory:
  enabled: true
  archivist: true
persistence:
  root: .anvil
safety:
  oneMutatingRunPerWorkspace: true
  securityMustBeReadOnly: true
  reviewerMustBeReadOnly: true
  refusePathEscapeFromWorkspace: true
