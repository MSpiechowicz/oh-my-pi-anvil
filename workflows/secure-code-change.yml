version: 1
workflow:
  name: secure-code-change
agents:
  planner: # Architect
    agent: architect
  implementation: # Smith
    agent: smith
  security: # Sentinel
    agent: sentinel
  review: # Inquisitor
    agent: inquisitor
checks: []
security:
  failOn: [critical, high, medium]
  maxAttempts: 3
review:
  maxAttempts: 3
implementation:
  maxAttempts: 6
planning:
  maxGenerations: 2
budgets:
  maxTotalTokens: 250000
  maxTotalRequests: 120
  maxTransitions: 40
context:
  maxInlineChars: 12000
memory:
  enabled: true
persistence:
  root: .omp/.anvil
safety:
  oneMutatingRunPerWorkspace: true
  securityMustBeReadOnly: true
  reviewerMustBeReadOnly: true
  refusePathEscapeFromWorkspace: true
