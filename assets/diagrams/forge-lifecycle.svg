<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1260" role="img" aria-labelledby="title desc">
  <title id="title">Anvil Forge lifecycle with optional advisory roles</title>
  <desc id="desc">Within PLAN, optional Scout runs once before Architect. Smith implements the plan, with independent tasks eligible for fan-out. All Smith work finishes before Warden checks, Sentinel security, and Inquisitor final review inspect the combined revision. Gate failures or blocking findings enter correction dispatch: validated reviewer repair tasks, otherwise Architect decomposition, then Smith. Corrections do not repeat Scout. Within REVIEW, after successful review and before sealing, optional Archivist makes one read-only curation attempt when memory.enabled, memory.retainOnSuccess, and memory.archivist are true. Both advisory roles default on and add no correctness gate. Sealing requires current revision-bound gate evidence; advisory workspace mutations invalidate it.</desc>
  <style>
    .surface { fill: #171b22; }
    .phase { fill: none; stroke: #394555; stroke-width: 1.5; }
    .node { fill: #202732; stroke: #627186; stroke-width: 2; }
    .gate { fill: #293342; }
    .advisory { stroke-dasharray: 6 5; }
    .correction { stroke: #e88c8c; }
    .terminal { fill: #e0b36a; stroke: #e0b36a; }
    .terminal-text { fill: #171b22; font: 700 17px system-ui, -apple-system, sans-serif; }
    .title { fill: #edf2f7; font: 700 22px system-ui, -apple-system, sans-serif; }
    .small-title { fill: #edf2f7; font: 700 17px system-ui, -apple-system, sans-serif; }
    .subtitle { fill: #a8b4c3; font: 15px system-ui, -apple-system, sans-serif; }
    .label { fill: #a8b4c3; font: 600 14px system-ui, -apple-system, sans-serif; }
    .warn { fill: #e88c8c; }
    .flow { fill: none; stroke: #627186; stroke-width: 2.5; marker-end: url(#arrow); }
    .return { fill: none; stroke: #e88c8c; stroke-width: 2; stroke-dasharray: 7 6; }
    .return-arrow { marker-end: url(#arrow-warn); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path fill="#627186" d="M0,0 L8,4 L0,8 Z" />
    </marker>
    <marker id="arrow-warn" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path fill="#e88c8c" d="M0,0 L8,4 L0,8 Z" />
    </marker>
  </defs>

  <rect class="surface" width="840" height="1260" rx="18" />
  <text class="label" x="32" y="40">FORGE LIFECYCLE · GATES INSPECT THE COMBINED REVISION</text>

  <rect class="phase" x="224" y="76" width="584" height="188" rx="16" />
  <text class="label" x="244" y="104">PLAN</text>
  <rect class="phase" x="224" y="716" width="376" height="372" rx="16" />
  <text class="label" x="244" y="744">REVIEW</text>

  <path class="flow" d="M176 178 H244" />
  <path class="flow" d="M484 178 H548" />
  <path class="flow" d="M668 236 V286 H412 V316" />
  <path class="flow" d="M412 416 V476" />
  <path class="flow" d="M412 572 V616" />
  <path class="flow" d="M412 712 V756" />
  <path class="flow" d="M412 852 V914" />
  <path class="flow" d="M412 1068 V1120" />

  <path class="return" d="M572 524 H772 M572 664 H772 M572 804 H772" />
  <path class="return return-arrow" d="M772 804 V430" />
  <path class="return return-arrow" d="M612 366 H572" />

  <rect class="terminal" x="32" y="146" width="144" height="64" rx="32" />
  <text class="terminal-text" x="104" y="184" text-anchor="middle">OBJECTIVE</text>

  <rect class="node advisory" x="244" y="126" width="240" height="110" rx="12" />
  <text class="title" x="364" y="158" text-anchor="middle">Scout</text>
  <text class="subtitle" x="364" y="182" text-anchor="middle">optional · default on</text>
  <text class="subtitle" x="364" y="204" text-anchor="middle">once · read-only reconnaissance</text>
  <text class="label" x="364" y="225" text-anchor="middle">ADVISORY, NOT A GATE</text>

  <rect class="node" x="548" y="126" width="240" height="110" rx="12" />
  <text class="title" x="668" y="161" text-anchor="middle">Architect</text>
  <text class="subtitle" x="668" y="188" text-anchor="middle">strict plan, task ownership</text>
  <text class="subtitle" x="668" y="211" text-anchor="middle">and acceptance criteria</text>

  <text class="label" x="32" y="354">IMPLEMENT</text>
  <rect class="node" x="252" y="316" width="320" height="100" rx="12" />
  <text class="title" x="412" y="347" text-anchor="middle">Smith</text>
  <text class="subtitle" x="412" y="372" text-anchor="middle">independent tasks may fan out</text>
  <text class="subtitle" x="412" y="396" text-anchor="middle">all workers finish before gates</text>

  <rect class="node correction" x="612" y="302" width="196" height="128" rx="12" />
  <text class="small-title" x="710" y="328" text-anchor="middle">Correction dispatch</text>
  <text class="subtitle" x="710" y="352" text-anchor="middle">Reviewer repair tasks</text>
  <text class="subtitle" x="710" y="373" text-anchor="middle">or Architect</text>
  <text class="subtitle" x="710" y="394" text-anchor="middle">decomposition</text>
  <text class="label warn" x="710" y="417" text-anchor="middle">Scout is not repeated</text>

  <text class="label" x="32" y="513">CHECKS</text>
  <rect class="node gate" x="252" y="476" width="320" height="96" rx="12" />
  <text class="title" x="412" y="508" text-anchor="middle">Warden</text>
  <text class="subtitle" x="412" y="533" text-anchor="middle">deterministic checks</text>
  <text class="subtitle" x="412" y="555" text-anchor="middle">exact revision</text>
  <text class="label warn" x="656" y="512" text-anchor="middle">FAILURE</text>

  <text class="label" x="32" y="653">SECURITY</text>
  <rect class="node gate" x="252" y="616" width="320" height="96" rx="12" />
  <text class="title" x="412" y="648" text-anchor="middle">Sentinel</text>
  <text class="subtitle" x="412" y="673" text-anchor="middle">read-only security gate</text>
  <text class="subtitle" x="412" y="695" text-anchor="middle">exact revision</text>
  <text class="label warn" x="674" y="639" text-anchor="middle">BLOCKING</text>
  <text class="label warn" x="674" y="657" text-anchor="middle">FINDINGS</text>

  <rect class="node gate" x="252" y="756" width="320" height="96" rx="12" />
  <text class="title" x="412" y="788" text-anchor="middle">Inquisitor</text>
  <text class="subtitle" x="412" y="813" text-anchor="middle">read-only final review</text>
  <text class="subtitle" x="412" y="835" text-anchor="middle">exact revision</text>
  <text class="label warn" x="674" y="779" text-anchor="middle">BLOCKING</text>
  <text class="label warn" x="674" y="797" text-anchor="middle">FINDINGS</text>
  <text class="label" x="438" y="888">PASS</text>

  <rect class="node advisory" x="252" y="914" width="320" height="154" rx="12" />
  <text class="title" x="412" y="946" text-anchor="middle">Archivist</text>
  <text class="subtitle" x="412" y="970" text-anchor="middle">optional · default on · once</text>
  <text class="subtitle" x="412" y="993" text-anchor="middle">read-only curation · not a gate</text>
  <text class="subtitle" x="412" y="1016" text-anchor="middle">Requires memory.enabled,</text>
  <text class="subtitle" x="412" y="1037" text-anchor="middle">memory.retainOnSuccess</text>
  <text class="subtitle" x="412" y="1058" text-anchor="middle">and memory.archivist</text>

  <rect class="terminal" x="292" y="1120" width="240" height="64" rx="32" />
  <text class="terminal-text" x="412" y="1147" text-anchor="middle">SEALED</text>
  <text x="412" y="1170" text-anchor="middle" fill="#171b22" font-family="system-ui, sans-serif" font-size="14">current gate evidence agrees</text>

  <text class="subtitle" x="420" y="1215" text-anchor="middle">Advisory failures add no gate; disabled roles are skipped.</text>
  <text class="subtitle" x="420" y="1238" text-anchor="middle">Any workspace mutation invalidates earlier gates, including advisory mutations.</text>
</svg>
